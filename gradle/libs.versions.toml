mockk = "1.13.13"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.13.0"
kotlin = "2.0.21"
composeBom = "2024.09.00"
navigationRuntimeKtx = "2.8.5"
navigationCompose = "2.8.5"
hilt = "2.59.2"
hiltNavigationCompose = "1.3.0"
ksp = "2.0.21-1.0.28"
ktor = "3.1.3"
appcompat = "1.7.0"
material  = "1.12.0"
