[versions]
agp = "9.0.1"
coreKtx = "1.15.0"
firebaseBom = "34.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.13.0"
kotlin = "2.0.21"
composeBom = "2024.09.00"
